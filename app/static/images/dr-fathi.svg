<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F6" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#D7E0EA" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="140" fill="#E8EEF5" />
  
  <!-- Calming Zen circle back -->
  <circle cx="200" cy="160" r="110" fill="none" stroke="#38A169" stroke-width="4" stroke-dasharray="8 6" opacity="0.3" />
  
  <!-- Shoulders & Coat -->
  <path d="M 80 400 C 90 320, 140 280, 200 280 C 260 280, 310 320, 320 400 Z" fill="url(#jacketGrad)" />
  <!-- Shirt collar -->
  <polygon points="170,280 200,340 185,280" fill="#FFFFFF" />
  <polygon points="230,280 200,340 215,280" fill="#FFFFFF" />
  <polygon points="195,300 205,300 202,370 198,370" fill="#4A5568" />
  
  <!-- Neck -->
  <rect x="175" y="210" width="50" height="80" rx="10" fill="#F0C9A8" />
  
  <!-- Head -->
  <ellipse cx="200" cy="170" rx="58" ry="70" fill="#F8D3B4" />
  
  <!-- Hair & Beard -->
  <path d="M 142 160 C 140 120, 160 100, 200 100 C 240 100, 260 120, 258 160 C 255 130, 235 115, 200 115 C 165 115, 145 130, 142 160 Z" fill="#2D3748" />
  <!-- Stylish short beard -->
  <path d="M 155 180 C 155 235, 175 250, 200 250 C 225 250, 245 235, 245 180 C 245 210, 230 240, 200 240 C 170 240, 155 210, 155 180 Z" fill="#2D3748" opacity="0.85" />
  
  <!-- Eyeglasses -->
  <circle cx="178" cy="165" r="16" fill="none" stroke="#2D3748" stroke-width="3" />
  <circle cx="222" cy="165" r="16" fill="none" stroke="#2D3748" stroke-width="3" />
  <line x1="194" y1="165" x2="206" y2="165" stroke="#2D3748" stroke-width="3" />
  <!-- Eyebrows -->
  <path d="M 166 148 Q 178 143 190 148" fill="none" stroke="#2D3748" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 210 148 Q 222 143 234 148" fill="none" stroke="#2D3748" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Eyes -->
  <circle cx="178" cy="165" r="4.5" fill="#2D3748" />
  <circle cx="222" cy="165" r="4.5" fill="#2D3748" />
  
  <!-- Friendly warm smile -->
  <path d="M 188 206 Q 200 216 212 206" fill="none" stroke="#C57A58" stroke-width="3" stroke-linecap="round" />
  
  <!-- Stethoscope / Emblem badge -->
  <circle cx="330" cy="80" r="32" fill="#2E7D32" opacity="0.9" />
  <path d="M 330 65 L 330 95 M 315 80 L 345 80" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
</svg>
