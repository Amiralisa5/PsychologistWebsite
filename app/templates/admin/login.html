<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Dasein Journal</title>
  <link rel="icon" type="image/jpeg" href="/static/images/logo.jpg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background-color: var(--bg-alt); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="width: 100%; max-width: 420px; padding: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="/static/images/logo.jpg" alt="Dasein Journal Logo" style="margin: 0 auto 1rem; width: 64px; height: 64px; border-radius: 14px; object-fit: cover; box-shadow: var(--shadow-md); border: 1px solid rgba(0,0,0,0.08);">
      <h1 style="font-size: 1.75rem; font-family: var(--font-sans); font-weight: 700; margin-bottom: 0.5rem;">Dasein Journal</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Therapist Portal · Dr. Hassan Agha Nasiri</p>
    </div>

    <div class="form-shell" style="padding: 2.25rem;">
      {% if error %}
      <div class="form-alert error" style="display: block; margin-bottom: 1.5rem;">
        {{ error }}
      </div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus placeholder="admin">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Sign In to Portal →
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        <small style="color: var(--text-light); font-size: 0.8rem;">
          Default credentials: <code>admin</code> / <code>psychologist2026</code>
        </small>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="/" style="color: var(--primary); font-size: 0.88rem; font-weight: 600;">
        ← Back to Public Website
      </a>
    </div>
  </div>
</body>
</html>
